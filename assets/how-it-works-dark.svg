<svg xmlns="http://www.w3.org/2000/svg" width="924" height="270" viewBox="0 0 924 270" role="img" aria-label="How pg-checkup works: it reads statistics views from your database with read-only SELECTs, runs on your machine, prints findings in the terminal, and only uploads a statistics file if you ask.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs>
<rect x="16" y="16" width="220" height="110" rx="12" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
<g transform="translate(206,42)"><ellipse cx="0" cy="0" rx="14" ry="5.5" fill="none" stroke="#f97316" stroke-width="1.8"/><path d="M-14 0v18c0 3 6.3 5.5 14 5.5s14-2.5 14-5.5V0" fill="none" stroke="#f97316" stroke-width="1.8"/></g>
<text x="36" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededed">Your database</text>
<text x="36" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">pg_stat_* and pg_catalog</text>
<text x="36" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">No table rows are read</text>
<line x1="242" y1="71" x2="344" y2="71" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="295.0" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#a3a3a3">read-only</text><text x="295.0" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#a3a3a3">SELECTs</text>
<rect x="350" y="16" width="220" height="110" rx="12" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
<g transform="translate(540,34)"><rect x="-14" y="-14" width="28" height="28" rx="7" fill="#f97316"/><path d="M-10 0h5.3l2.3-5.8 3.5 11.6 2.3-5.8h7" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="370" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededed">pg-checkup</text>
<text x="370" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">Runs on your machine</text>
<text x="370" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">The session cannot write</text>
<line x1="576" y1="60" x2="678" y2="60" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="605.0" y="50.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#a3a3a3">prints</text>
<rect x="684" y="16" width="220" height="110" rx="12" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
<g transform="translate(874,34)"><rect x="-14" y="-11" width="28" height="22" rx="4" fill="none" stroke="#f97316" stroke-width="1.8"/><path d="M-8 -4l4 4-4 4M0 4h7" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="704" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededed">Your terminal</text>
<text x="704" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">Fix now · fix next · watch</text>
<text x="704" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">Why and how for each</text>
<line x1="460" y1="130" x2="460" y2="172" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="470" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#a3a3a3">saves</text>
<rect x="350" y="176" width="220" height="78" rx="12" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>

<text x="370" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededed">checkup.json</text>
<text x="370" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">Statistics only</text>
<line x1="576" y1="215" x2="678" y2="215" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="605.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#a3a3a3">upload</text>
<rect x="684" y="176" width="220" height="78" rx="12" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
<g transform="translate(874,194)"><circle cx="0" cy="0" r="11" fill="none" stroke="#f97316" stroke-width="1.8"/><path d="M-11 0h22M0 -11c-4 3.5-4 18.5 0 22M0 -11c4 3.5 4 18.5 0 22" fill="none" stroke="#f97316" stroke-width="1.5"/></g>
<text x="704" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededed">pgcheckup.com</text>
<text x="704" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#a3a3a3">Shareable report, optional</text>
<text x="16" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#a3a3a3">Nothing leaves your machine unless you run <tspan font-family="ui-monospace, Menlo, Consolas, monospace">upload</tspan>.</text>
</svg>